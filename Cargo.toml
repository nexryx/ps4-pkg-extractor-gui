[package]
name = "pkgextract"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
directories = "6"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
fastframe-file = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1", default-features = false }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
log = "0.4"
orbis-pkg-util = { version = "0.1.0", features = ["cli"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1", features = ["build"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
