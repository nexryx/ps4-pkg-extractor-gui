name: Build and Publish Binaries

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release (untick to only build and keep the zips as run artifacts)"
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version from Cargo.toml
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          if [ -n "$RELEASE_TAG" ] && [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match Cargo.toml version '$version'. Bump the version (and Cargo.lock), or retag."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building v$version"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: Windows ARM64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            ext: .exe
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: Linux ARM64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            ext: ""
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          mkdir -p package/licenses
          release_dir="target/${{ matrix.target }}/release"
          cp "$release_dir/pkgextract${{ matrix.ext }}" package/
          cp LICENSE package/LICENSE
          cp licenses/Figtree-OFL.txt licenses/Lucide-LICENSE.txt package/licenses/
          asset_name="pkgextract-${{ matrix.target }}.zip"
          python3 - "$asset_name" <<'PY'
          import os
          import sys
          import zipfile
          zip_path = f"dist/{sys.argv[1]}"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk("package"):
                  for name in sorted(files):
                      full = os.path.join(root, name)
                      info = zipfile.ZipInfo.from_file(full, os.path.relpath(full, "package"))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      with open(full, "rb") as handle:
                          zf.writestr(info, handle.read())
          PY

      - name: Keep the zip as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgextract-${{ matrix.target }}
          path: dist/pkgextract-${{ matrix.target }}.zip
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every zip
        uses: actions/download-artifact@v4
        with:
          pattern: pkgextract-*
          merge-multiple: true
          path: dist

      - name: Attach the zips to the release that was just published
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

      - name: Create the release and attach the zips
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*.zip
